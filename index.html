<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeeDash – Frau Honigs kleines Bienen-Abenteuer</title>
  </head>
  <body>
    <div id="app">
      <!-- 3D Spielfeld-Container -->
      <div id="game-screen" class="screen hidden">
        <div id="game-canvas-wrap"></div>
        <div id="hud-root"></div>
        <div id="level-toast" class="level-toast hidden" aria-live="polite"></div>
      </div>

      <!-- Sechseck-Bienenstock-Karte -->
      <div id="map-screen" class="screen"></div>

      <!-- 3D Koffer-Bühne am Level-Ende -->
      <div id="suitcase-stage-root" class="suitcase-stage-root hidden"></div>

      <!-- Modale Dialoge & Overlays -->
      <div id="dialog-root" class="dialog-root hidden"></div>

      <!-- Interaktives 3D-Atelier (Modelle & Koffer-Szenen testen) -->
      <div id="studio-root" class="studio-root hidden"></div>

      <!-- Albertas Erfinder-Werkstatt (Logik-Schaltungen Extra-Level) -->
      <div id="alberta-root" class="alberta-root hidden"></div>

      <!-- Freundliche Spielpause / Schlaf-Schwarm-Animation -->
      <div id="sleep-lock-root" class="sleep-lock-root hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
